<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itch NYC Spot Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: photocopied zine. Drawn map on the left, spot list + detail on the right; stacks on phones. */
:root {
  --paper: #d9d9d4;
  --paper-2: #c9c9c3;
  --ink: #111111;
  --ink-soft: #4a4a46;
  --water: #b4b8b6;
  --hot: #ff3d14;
  --display: "Archivo Black", "Arial Black", Impact, sans-serif;
  --body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.5;
}
a { color: inherit; }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }

header {
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
  gap: 8px 24px;
  padding: 20px clamp(16px, 4vw, 40px) 14px;
  border-bottom: 3px solid var(--ink);
}
.logo {
  font-family: var(--display);
  font-size: clamp(40px, 9vw, 76px);
  line-height: .85; letter-spacing: -.02em; margin: 0;
  text-transform: uppercase;
}
.logo span { color: var(--hot); }
.tag { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; max-width: 34ch; text-wrap: balance; }

main {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 0;
}
@media (max-width: 820px) { main { grid-template-columns: 1fr; } }

.map-wrap { border-right: 3px solid var(--ink); position: relative; }
@media (max-width: 820px) { .map-wrap { border-right: 0; border-bottom: 3px solid var(--ink); } }
#map { width: 100%; height: min(82vh, 900px); min-height: 460px; background: var(--water); }
@media (max-width: 820px) { #map { height: 62vh; min-height: 380px; } }
/* Real map tiles, pushed to a photocopied grey */
#map .maplibregl-canvas { filter: grayscale(1) contrast(1.12) brightness(.97); }
.pin {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--ink); color: var(--paper); border: 3px solid var(--paper);
  font: 15px var(--display); box-shadow: 0 0 0 2px var(--ink); transition: background .15s;
}
.pin:hover, .pin:focus-visible { background: var(--hot); color: var(--ink); }
.pin.on { background: var(--hot); color: var(--ink); box-shadow: 0 0 0 2px var(--ink), 0 0 0 7px var(--hot); }
.pin:focus { outline: none; }
.pin.spot { width: 18px; height: 18px; border-width: 3px; }
.pin.spot.on { box-shadow: 0 0 0 2px var(--ink), 0 0 0 6px var(--hot); }
.pin.cluster { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 0 0 3px var(--paper); font-size: 14px; }
.pin.cluster:hover, .pin.cluster:focus-visible { background: var(--hot); }
.map-tools { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 2; }
.map-tools button {
  font: 12px var(--display); text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
  padding: 8px 12px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink);
}
.map-tools button:hover { background: var(--ink); color: var(--paper); }
.maplibregl-ctrl-attrib { font-family: var(--body); font-size: 10px; }
.map-error { position: absolute; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; background: var(--paper-2); font-size: 13px; }

.side { display: flex; flex-direction: column; min-width: 0; }
.finder { padding: 14px 16px 12px; border-bottom: 3px solid var(--ink); display: grid; gap: 10px; }
.search-row { display: flex; gap: 8px; }
.search-row input {
  flex: 1; min-width: 0; font: 15px var(--body); padding: 10px 12px; color: var(--ink);
  background: var(--paper); border: 3px solid var(--ink); border-radius: 0;
}
.search-row input::placeholder { color: var(--ink-soft); }
.search-row button, .chip {
  font: 12px var(--display); text-transform: uppercase; letter-spacing: .04em; cursor: pointer;
  padding: 8px 12px; border: 3px solid var(--ink); background: var(--paper); color: var(--ink); white-space: nowrap;
}
.search-row button:hover, .chip:hover { background: var(--ink); color: var(--paper); }
.search-row button[aria-pressed="true"] { background: var(--hot); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips:empty { display: none; }
.chip { padding: 4px 9px; border-width: 2px; font-size: 11px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.result-line { margin: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; }
.result-line button { font: inherit; background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; text-transform: uppercase; letter-spacing: .08em; }
.empty { padding: 18px 16px; font-size: 13px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.card .dist { display: block; font-size: 11px; margin-top: 2px; text-transform: uppercase; letter-spacing: .06em; }
.me-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--hot); border: 3px solid var(--ink); box-shadow: 0 0 0 4px rgba(255,61,20,.25); }
.list { list-style: none; margin: 0; padding: 0; border-bottom: 3px solid var(--ink); }
.list li + li { border-top: 1px dashed var(--ink); }
.card {
  width: 100%; display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px;
  padding: 12px 16px; background: none; border: 0; color: inherit; text-align: left; cursor: pointer; font: inherit;
}
.card:hover { background: var(--paper-2); }
.card[aria-current="true"] { background: var(--ink); color: var(--paper); }
.card .num { font: 20px var(--display); width: 34px; height: 34px; display: grid; place-items: center; border: 2px solid currentColor; border-radius: 50%; }
.card[aria-current="true"] .num { background: var(--hot); border-color: var(--hot); color: var(--ink); }
.card img { width: 64px; height: 64px; object-fit: cover; display: block; filter: grayscale(1) contrast(1.15); }
.card[aria-current="true"] img { filter: none; }
.card h3 { margin: 0; font: 17px/1.1 var(--display); text-transform: uppercase; }
.card p { margin: 2px 0 0; font-size: 12px; opacity: .8; }
.card .count { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }

.detail { padding: 18px 16px 28px; display: grid; gap: 14px; }
.nav { display: flex; gap: 8px; width: 100%; }
.nav a { font: 13px var(--display); text-transform: uppercase; text-decoration: none; padding: 8px 14px; border: 3px solid var(--ink); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.nav a:hover { background: var(--hot); color: var(--ink); }
.sheet-close { display: none; }
@media (max-width: 820px) {
  /* On phones the spot opens as a sheet over the map instead of below the list. */
  .detail {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-height: 78vh; overflow-y: auto;
    background: var(--paper); border-top: 3px solid var(--ink); box-shadow: 0 -10px 30px rgba(0,0,0,.25);
    transform: translateY(105%); transition: transform .25s ease; padding-top: 8px;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
  }
  .detail.open { transform: none; }
  .sheet-close {
    display: flex; justify-content: space-between; align-items: center; position: sticky; top: -8px; z-index: 1;
    background: var(--paper); margin: 0 -16px; padding: 8px 16px; border-bottom: 1px dashed var(--ink);
  }
  .sheet-close span { width: 44px; height: 5px; border-radius: 3px; background: var(--ink-soft); }
  .sheet-close button { font: 12px var(--display); text-transform: uppercase; padding: 8px 12px; border: 3px solid var(--ink); background: var(--hot); color: var(--ink); cursor: pointer; }
}
.detail h2 { margin: 0; font: clamp(28px, 5vw, 42px)/.95 var(--display); text-transform: uppercase; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin: 0; padding: 0; list-style: none; font-size: 12px; }
.meta li { border: 1.5px solid var(--ink); padding: 2px 8px; text-transform: uppercase; letter-spacing: .05em; }
.meta li.coords { font-variant-numeric: tabular-nums; text-transform: none; }
.notes { margin: 0; max-width: 60ch; font-size: 14px; }
.photos { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.photos figure { margin: 0; flex: 0 0 min(78%, 320px); scroll-snap-align: start; }
.photos img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; border: 3px solid var(--ink); background: var(--paper-2); }
.photos figcaption { font-size: 11px; margin-top: 4px; color: var(--ink-soft); }
.go { display: flex; flex-wrap: wrap; gap: 10px; }
.go a {
  font: 13px var(--display); text-transform: uppercase; text-decoration: none; letter-spacing: .03em;
  padding: 10px 14px; border: 3px solid var(--ink); background: var(--paper);
}
.go a:hover { background: var(--ink); color: var(--paper); }
.go a.primary { background: var(--hot); }
.go a.primary:hover { background: var(--ink); }

footer { padding: 14px clamp(16px, 4vw, 40px); border-top: 3px solid var(--ink); font-size: 11px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px; text-transform: uppercase; letter-spacing: .08em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header>
  <h1 class="logo">Itch<span>/</span>NYC Spots</h1>
  <p class="tag">Spots we've hit around the city. Tap a pin for photos and directions.</p>
  <nav class="nav" aria-label="Pages"><a href="./" aria-current="page">Map</a><a href="gallery.html">Gallery</a></nav>
</header>

<main>
  <section class="map-wrap" aria-label="Map of New York City skate spots">
    <div class="map-tools">
      <button type="button" id="fit-spots">Spots</button>
      <button type="button" id="fit-nyc">All NYC</button>
    </div>
    <div id="map"></div>
    <div class="map-error" id="map-error">The map couldn't load. The spot list and directions still work.</div>
  </section>

  <section class="side">
    <div class="finder" role="search">
      <div class="search-row">
        <label for="q" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search spots</label>
        <input id="q" type="search" placeholder="Search spots, areas, notes…" autocomplete="off">
        <button type="button" id="near" aria-pressed="false">Near me</button>
      </div>
      <div class="chips" id="chips"></div>
      <p class="result-line"><span id="result-count"></span><button type="button" id="clear" hidden>Clear</button></p>
    </div>
    <ul class="list" id="list"></ul>
    <article class="detail" id="detail" aria-live="polite"></article>
  </section>
</main>

<footer>
  <span>Itch Magazine · Spot Map Vol. 1 · Map data © OpenStreetMap contributors</span>
  <span id="spot-count"></span>
</footer>

<script>
// ---- Spot data. Add a spot by adding an object here. ----
const SPOTS = /*SPOTS_JSON*/[];

// Each spot's pin sits at the average of its photos' GPS points.
SPOTS.forEach(s => {
  s.lat = s.photos.reduce((a, p) => a + p.lat, 0) / s.photos.length;
  s.lon = s.photos.reduce((a, p) => a + p.lon, 0) / s.photos.length;
});

// ---- Real map: MapLibre + OpenFreeMap (OpenStreetMap data) ----
const NYC = [[-74.26, 40.49], [-73.70, 40.92]];
let map = null;
const markers = {};

function spotBounds() {
  const lons = SPOTS.map(s => s.lon), lats = SPOTS.map(s => s.lat);
  return [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];
}
function fitSpots(animate) {
  if (!map) return;
  const pad = window.matchMedia("(max-width: 820px)").matches ? 50 : 90;
  map.fitBounds(spotBounds(), { padding: pad, maxZoom: 16, duration: animate ? 800 : 0 });
}

function spotsGeo(list) {
  return { type: "FeatureCollection", features: list.map(s => ({ type: "Feature", properties: { id: s.id }, geometry: { type: "Point", coordinates: [s.lon, s.lat] } })) };
}

function drawMap() {
  const fail = () => { document.getElementById("map-error").style.display = "grid"; };
  if (!window.maplibregl) { fail(); return; }
  try {
    map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/positron",
      bounds: SPOTS.length ? spotBounds() : NYC,
      fitBoundsOptions: { padding: 90, maxZoom: 16 },
      maxBounds: [[-74.6, 40.35], [-73.4, 41.05]],
      minZoom: 9,
      attributionControl: { compact: true },
      cooperativeGestures: window.matchMedia("(max-width: 820px)").matches
    });
  } catch (e) { fail(); return; }
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  map.on("load", () => {
    // Recolor the base style toward the zine palette.
    const css = getComputedStyle(document.documentElement);
    const paper = css.getPropertyValue("--paper").trim(), water = css.getPropertyValue("--water").trim();
    map.getStyle().layers.forEach(l => {
      try {
        if (l.type === "background") map.setPaintProperty(l.id, "background-color", paper);
        if (l.type === "fill" && /water/.test(l.id)) map.setPaintProperty(l.id, "fill-color", water);
      } catch (e) {}
    });
  });
  // Spots live in a clustered GeoJSON source; pins and cluster counts are DOM markers.
  const makePin = s => {
    const el = document.createElement("button");
    el.type = "button"; el.className = "pin spot"; el.dataset.id = s.id;
    el.setAttribute("aria-label", s.name); el.title = s.name;
    el.addEventListener("click", e => { e.stopPropagation(); select(s.id, true); });
    return new maplibregl.Marker({ element: el }).setLngLat([s.lon, s.lat]);
  };
  SPOTS.forEach(s => { markers[s.id] = makePin(s); });
  const clusterMarkers = {};
  let shown = {};
  window.updateMarkers = () => {
    if (!map.getSource("spots") || !map.isSourceLoaded("spots")) return;
    const next = {};
    map.querySourceFeatures("spots").forEach(f => {
      const pr = f.properties;
      if (pr.cluster) {
        const key = "c" + pr.cluster_id;
        if (next[key]) return;
        let m = clusterMarkers[key];
        if (!m) {
          const el = document.createElement("button");
          el.type = "button"; el.className = "pin cluster";
          const n = pr.point_count, size = Math.min(64, 34 + Math.sqrt(n) * 4);
          el.style.width = el.style.height = size + "px";
          el.textContent = n; el.setAttribute("aria-label", `${n} spots here, zoom in`);
          el.addEventListener("click", ev => {
            ev.stopPropagation();
            map.getSource("spots").getClusterExpansionZoom(pr.cluster_id)
              .then(z => map.easeTo({ center: f.geometry.coordinates, zoom: Math.min(z + 0.3, 18), duration: 500 }))
              .catch(() => map.easeTo({ center: f.geometry.coordinates, zoom: map.getZoom() + 2 }));
          });
          m = clusterMarkers[key] = new maplibregl.Marker({ element: el }).setLngLat(f.geometry.coordinates);
        }
        next[key] = m;
      } else if (markers[pr.id]) next[pr.id] = markers[pr.id];
    });
    Object.keys(shown).forEach(k => { if (!next[k]) shown[k].remove(); });
    Object.keys(next).forEach(k => { if (!shown[k]) next[k].addTo(map); });
    shown = next;
  };
  map.on("load", () => {
    map.addSource("spots", { type: "geojson", data: spotsGeo(SPOTS), cluster: true, clusterRadius: 44, clusterMaxZoom: 16 });
    map.addLayer({ id: "spots-hit", type: "circle", source: "spots", paint: { "circle-radius": 0, "circle-opacity": 0 } });
    map.on("render", window.updateMarkers);
  });
  document.getElementById("fit-spots").addEventListener("click", () => fitSpots(true));
  document.getElementById("fit-nyc").addEventListener("click", () => map.fitBounds(NYC, { padding: 20, duration: 800 }));
}

const fmtDate = t => new Date(t.replace(" ", "T")).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const fmtTime = t => new Date(t.replace(" ", "T")).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });

// ---- Search + filters ----
const state = { q: "", tags: new Set(), me: null };
const norm = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
SPOTS.forEach((s, i) => {
  s.num = i + 1;
  s.tags = s.tags || [];
  s.hay = norm([s.name, s.area, s.notes, s.tags.join(" "), s.photos.map(p => p.file || "").join(" ")].join(" "));
});
const ALL_TAGS = [...new Set(SPOTS.flatMap(s => s.tags.map(t => t.toLowerCase())))].sort();

function km(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLon = (b.lon - a.lon) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = k => { const mi = k * 0.621371; return mi < 0.1 ? `${Math.round(mi * 5280)} ft away` : `${mi.toFixed(mi < 10 ? 1 : 0)} mi away`; };

function visibleSpots() {
  const words = norm(state.q).split(/\s+/).filter(Boolean);
  let out = SPOTS.filter(s =>
    words.every(w => s.hay.includes(w)) &&
    [...state.tags].every(t => s.tags.map(x => x.toLowerCase()).includes(t)));
  if (state.me) out = out.slice().sort((a, b) => km(state.me, a) - km(state.me, b));
  return out;
}

function drawChips() {
  document.getElementById("chips").innerHTML = ALL_TAGS.map(t =>
    `<button type="button" class="chip" data-tag="${t}" aria-pressed="${state.tags.has(t)}">${t}</button>`).join("");
  document.querySelectorAll("#chips .chip").forEach(c => c.addEventListener("click", () => {
    const t = c.dataset.tag; state.tags.has(t) ? state.tags.delete(t) : state.tags.add(t); refresh();
  }));
}

function drawList() {
  const vis = visibleSpots();
  const list = document.getElementById("list");
  list.innerHTML = vis.length ? vis.map(s => `
    <li><button class="card" data-id="${s.id}" type="button">
      <img src="${s.photos[0].thumb}" alt="">
      <span><h3>${s.name}</h3><p>${s.area || "NYC"}</p>${state.me ? `<span class="dist">${fmtDist(km(state.me, s))}</span>` : ""}</span>
      <span class="count">${s.photos.length} photo${s.photos.length > 1 ? "s" : ""}</span>
    </button></li>`).join("")
    : `<li class="empty">No spots match. Try another word or clear the filters.</li>`;
  list.querySelectorAll(".card").forEach(b => b.addEventListener("click", () => select(b.dataset.id, true)));
  const filtered = state.q || state.tags.size;
  document.getElementById("result-count").textContent = filtered ? `${vis.length} of ${SPOTS.length} spots` : `${SPOTS.length} spots${state.me ? " · nearest first" : ""}`;
  document.getElementById("clear").hidden = !filtered;
  const ids = new Set(vis.map(s => s.id));
  if (map && map.getSource && map.getSource("spots")) map.getSource("spots").setData(spotsGeo(vis));
  const cur = (location.hash || "").slice(1);
  document.querySelectorAll(".card").forEach(b => b.setAttribute("aria-current", b.dataset.id === cur ? "true" : "false"));
  document.getElementById("spot-count").textContent = `${SPOTS.length} spots · ${SPOTS.reduce((a, s) => a + s.photos.length, 0)} photos`;
  return vis;
}

function refresh() {
  drawChips();
  const vis = drawList();
  if (map && vis.length && (state.q || state.tags.size)) {
    const lons = vis.map(s => s.lon), lats = vis.map(s => s.lat);
    map.fitBounds([[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]], { padding: 90, maxZoom: 16, duration: 600 });
  }
}

let qTimer;
document.getElementById("q").addEventListener("input", e => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value; refresh(); }, 150); });
document.getElementById("clear").addEventListener("click", () => { state.q = ""; state.tags.clear(); document.getElementById("q").value = ""; refresh(); fitSpots(true); });

let meMarker = null;
document.getElementById("near").addEventListener("click", e => {
  const btn = e.currentTarget;
  if (state.me) { state.me = null; btn.setAttribute("aria-pressed", "false"); if (meMarker) meMarker.remove(); meMarker = null; refresh(); return; }
  if (!navigator.geolocation) { btn.textContent = "No location"; return; }
  btn.textContent = "Locating…";
  navigator.geolocation.getCurrentPosition(pos => {
    state.me = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    btn.textContent = "Near me"; btn.setAttribute("aria-pressed", "true");
    if (map) {
      const el = document.createElement("div"); el.className = "me-dot"; el.title = "You";
      meMarker = new maplibregl.Marker({ element: el }).setLngLat([state.me.lon, state.me.lat]).addTo(map);
      const near = visibleSpots()[0];
      if (near) map.fitBounds([[Math.min(state.me.lon, near.lon), Math.min(state.me.lat, near.lat)], [Math.max(state.me.lon, near.lon), Math.max(state.me.lat, near.lat)]], { padding: 90, maxZoom: 16, duration: 800 });
    }
    refresh();
  }, () => { btn.textContent = "Location off"; setTimeout(() => { btn.textContent = "Near me"; }, 2500); }, { enableHighAccuracy: true, timeout: 10000 });
});

function select(id, fromUser) {
  const i = SPOTS.findIndex(s => s.id === id);
  if (i < 0) return;
  const s = SPOTS[i];
  document.querySelectorAll(".pin").forEach(g => g.classList.toggle("on", g.dataset.id === id));
  if (map && fromUser) map.easeTo({ center: [s.lon, s.lat], zoom: Math.max(map.getZoom(), 17), duration: 700 });
  document.querySelectorAll(".card").forEach(b => b.setAttribute("aria-current", b.dataset.id === id ? "true" : "false"));
  const ll = `${s.lat.toFixed(6)},${s.lon.toFixed(6)}`;
  document.getElementById("detail").innerHTML = `
    <div class="sheet-close"><span aria-hidden="true"></span><button type="button" id="sheet-close">Back to map</button></div>
    <h2>${s.name}</h2>
    <ul class="meta">
      ${s.area ? `<li>${s.area}</li>` : ""}
      <li>Shot ${fmtDate(s.photos[0].time)}</li>
      <li class="coords">${s.lat.toFixed(5)}, ${s.lon.toFixed(5)}</li>
    </ul>
    ${s.tags.length ? `<div class="tags">${s.tags.map(t => `<button type="button" class="chip" data-jump="${t.toLowerCase()}">${t}</button>`).join("")}</div>` : ""}
    ${s.notes ? `<p class="notes">${s.notes}</p>` : ""}
    <div class="photos">${s.photos.map((p, j) => `
      <figure><img src="${p.src}" alt="${s.name}, photo ${j + 1}" loading="lazy">
      <figcaption>${String(j + 1).padStart(2, "0")} / ${String(s.photos.length).padStart(2, "0")} · ${fmtTime(p.time)}</figcaption></figure>`).join("")}
    </div>
    <div class="go">
      <a class="primary" href="https://maps.apple.com/?ll=${ll}&q=${encodeURIComponent(s.name)}" target="_blank" rel="noopener">Apple Maps</a>
      <a href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank" rel="noopener">Google Maps</a>
    </div>`;
  document.querySelectorAll("[data-jump]").forEach(c => c.addEventListener("click", () => { state.tags = new Set([c.dataset.jump]); refresh(); }));
  if (fromUser) {
    try { history.replaceState(null, "", "#" + id); } catch (e) { location.hash = id; }
  }
  const mobile = window.matchMedia("(max-width: 820px)").matches;
  const det = document.getElementById("detail");
  det.scrollTop = 0;
  if (mobile && (fromUser || location.hash)) {
    det.classList.add("open");
    window.scrollTo({ top: 0, behavior: fromUser ? "smooth" : "auto" });
  }
  document.getElementById("sheet-close").addEventListener("click", () => det.classList.remove("open"));
}

drawMap();
drawChips();
drawList();
select((location.hash || "").slice(1) || SPOTS[0].id, false);
window.addEventListener("hashchange", () => select(location.hash.slice(1), false));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("detail").classList.remove("open"); });
</script>
</body>
</html>
